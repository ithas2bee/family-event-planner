name: huddleup

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:?Set MSSQL_PID to a production-licensed SQL Server edition}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set a strong SQL Server administrator password in .env}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?Set a strong Huddle Up database password in .env}"
    volumes:
      - huddleup_sql_data:/var/opt/mssql
      - ./database/bootstrap.sql:/opt/huddleup/bootstrap.sql:ro
    networks:
      - huddleup-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"
          -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "${ConnectionStrings__DefaultConnection:?Set the SQL Server connection string in .env}"
      Jwt__Secret: "${JWT_SECRET:?Set a unique 32-byte-or-longer JWT secret in .env}"
      Jwt__Issuer: "${JWT_ISSUER:-FamilyEventPlanner.Api}"
      Jwt__Audience: "${JWT_AUDIENCE:-FamilyEventPlanner.Mobile}"
      GooglePlaces__ApiKey: "${GOOGLE_PLACES_API_KEY:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      Email__FromAddress: "${EMAIL_FROM_ADDRESS:-}"
      Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS:-}"
    ports:
      - "127.0.0.1:8090:8080"
    networks:
      - huddleup-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  huddleup-network:
    name: huddleup-network
    driver: bridge

volumes:
  huddleup_sql_data:
    name: huddleup_sql_data
